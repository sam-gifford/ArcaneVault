name: Core Build

on:
  push:
    branches:
      - agent/core-70
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArcaneVault.slnx

      - name: Build
        run: dotnet build ArcaneVault.slnx --configuration Release --no-restore
